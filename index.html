<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drone QR Notities</title>
<style>
:root{
  --bg:#f3f5f7;--surface:#ffffff;--surface-2:#f8fafb;--text:#17202a;
  --muted:#66737d;--line:#dce3e8;--accent:#1f6f4a;--accent-dark:#16563a;
  --danger:#b42318;--shadow:0 8px 30px rgba(23,32,42,.07)
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--text);line-height:1.45}
header{background:linear-gradient(135deg,#15231e,#1f6f4a);color:#fff;padding:16px 20px;box-shadow:0 2px 14px rgba(0,0,0,.14)}
.header-inner{max-width:980px;margin:auto;display:flex;align-items:center;gap:13px}
.logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:0 0 auto}
.logo svg{width:27px;height:27px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{font-weight:800;font-size:19px;letter-spacing:.1px}.brand-sub{font-size:12px;color:rgba(255,255,255,.72);margin-top:1px}
main{max-width:980px;margin:26px auto;padding:0 16px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 14px;font-size:19px;letter-spacing:-.2px}.card h3{margin:0}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:white;transition:.15s ease}
button:hover{background:var(--accent-dark);transform:translateY(-1px)}
button.secondary{background:#edf1f3;color:var(--text)}button.secondary:hover{background:#e3e8eb}
button.danger{background:var(--danger)}button.danger:hover{background:#941b12}
input,textarea{width:100%;padding:11px 12px;border:1px solid #cbd4da;border-radius:9px;font:inherit;margin:6px 0 13px;background:#fff;color:var(--text);outline:none}
input:focus,textarea:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,74,.10)}
label{font-weight:700;font-size:13px;color:#34414a}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px}
.list{display:grid;gap:9px}
.item{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.item b{font-size:14px}.muted{color:var(--muted);font-size:13px}
.qrbox{text-align:center}.qrbox img{max-width:280px;width:100%;border:1px solid var(--line);border-radius:12px;padding:8px;background:white}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{padding:10px 12px;border-radius:9px;background:#eef5f1;margin-bottom:12px}.error{background:#fff0ef;color:#8a1c13}
.folder{border:1px solid var(--line);border-radius:13px;padding:15px;background:var(--surface-2);transition:.15s ease}
.folder:hover{border-color:#c7d2d8;box-shadow:0 4px 14px rgba(23,32,42,.05)}
.folder h3{font-size:15px}.folder-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:11px}
.folder-count{font-size:12px;color:var(--muted);margin-top:3px}.empty{padding:7px 0}
.select{width:100%;padding:11px 12px;border:1px solid #cbd4da;border-radius:9px;font:inherit;margin:6px 0 13px;background:white}
.crumb{font-size:13px;color:var(--muted);margin-bottom:8px}
.hero{background:linear-gradient(135deg,#fff,#f6f9f7);border:1px solid var(--line)}
.hero-title{display:flex;align-items:center;gap:10px;margin-bottom:7px}.hero-icon{width:36px;height:36px;border-radius:10px;background:#e6f1eb;color:var(--accent);display:grid;place-items:center;font-size:18px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}
.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;color:var(--muted);background:#fff}
@media(max-width:650px){.grid{grid-template-columns:1fr}main{margin-top:16px;padding:0 12px 30px}.card{padding:16px}.item{gap:10px}.item button{padding:9px 11px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><div class="header-inner">
  <div class="logo" aria-label="Drone">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M8 12h6l2 2 2-2h6"/>
      <path d="M10 12l-2-4M22 12l2-4M10 20l-2 4M22 20l2 4"/>
      <path d="M13 14h6v5h-6z"/>
      <path d="M11 18h10"/>
      <circle cx="7" cy="6.5" r="2"/><circle cx="25" cy="6.5" r="2"/>
      <circle cx="7" cy="25.5" r="2"/><circle cx="25" cy="25.5" r="2"/>
    </svg>
  </div>
  <div><div class="brand">Drone QR Notities</div><div class="brand-sub">Fleet & onderhoudsbeheer</div></div>
</div></header>
<main id="app"><div class="card">Laden...</div></main>
<script>
/*
  Vul deze twee waarden in met de gegevens uit Supabase.
  Gebruik ALLEEN de publishable/anon key. NOOIT de service_role key.
*/
const SUPABASE_URL = "https://mgnkjwwpvslwwgtpdjzo.supabase.co";
const SUPABASE_KEY = "sb_publishable_ffVQ1eDnC3G7R6oimAZC2Q_ARyvzTdW";
const configured = !SUPABASE_URL.includes("VUL_HIER") && !SUPABASE_KEY.includes("VUL_HIER");
const db = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const app=document.getElementById("app");

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function qrUrl(id){return location.href.split("#")[0]+"#drone="+encodeURIComponent(id);}
function qrImage(text){return "https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=12&data="+encodeURIComponent(text);}
function field(label,key,val){return `<div><label>${label}</label><input id="${key}" value="${esc(val)}"></div>`;}

async function getDrones(){
  const {data,error}=await db.from("drones").select("*,folders(id,name)").order("drone_id");
  if(error) throw error; return data||[];
}
async function getFolders(){
  const {data,error}=await db.from("folders").select("*").order("name");
  if(error) throw error; return data||[];
}
async function getDrone(id){
  const {data,error}=await db.from("drones").select("*,folders(id,name)").eq("drone_id",id).maybeSingle();
  if(error) throw error; return data;
}
function showError(e){
  app.innerHTML=`<div class="card error"><h2>Er is iets misgegaan</h2><p>${esc(e.message||e)}</p><button onclick="location.reload()">Opnieuw proberen</button></div>`;
}
function folderCard(folder,count,subCount=0){
  return `<div class="folder">
    <h3>▣ ${esc(folder.name)}</h3>
    <div class="folder-count">${count} ${count===1?"drone":"drones"}${subCount?` · ${subCount} ${subCount===1?"submap":"submappen"}`:""}</div>
    <div class="folder-actions" style="margin-top:10px">
      <button onclick="openFolder(${folder.id})">Openen</button>
      <button class="secondary" onclick="renameFolder(${folder.id},'${esc(folder.name).replace(/'/g,"\\'")}')">Naam wijzigen</button>
      <button class="danger" onclick="removeFolder(${folder.id},'${esc(folder.name).replace(/'/g,"\\'")}')">Verwijderen</button>
    </div>
  </div>`;
}
async function home(){
  if(!configured){
    app.innerHTML=`<div class="card error"><h2>Supabase nog niet gekoppeld</h2><p>Open <b>index.html</b> en vul alleen de <b>Publishable key</b> van Supabase in bij SUPABASE_KEY. Gebruik nooit de Secret key.</p></div>`;
    return;
  }
  try{
    const [rows,folders]=await Promise.all([getDrones(),getFolders()]);
    const topFolders=folders.filter(f=>!f.parent_id);
    app.innerHTML=`<div class="card hero">
      <div class="hero-title"><div class="hero-icon">▦</div><h2>Dronebeheer</h2></div>
      <p class="muted">Organiseer je drones in een onbeperkte mappenstructuur. Maak op ieder niveau een submap of voeg direct een drone toe.</p>
      <div class="actions"><button onclick="newFolder(null)">+ Nieuwe map</button><button class="secondary" onclick="location.hash='dashboard'">Dashboard</button></div>
    </div>
    <div class="card"><div class="section-head"><h2>Mijn mappen</h2><span class="badge">${topFolders.length} ${topFolders.length===1?"map":"mappen"}</span></div><div id="folders" class="list"></div></div>
    <div class="card"><div class="section-head"><h2>Drones zonder map</h2></div><div id="unassigned" class="list"></div></div>`;

    const folderEl=document.getElementById("folders");
    if(!topFolders.length) folderEl.innerHTML='<p class="muted empty">Nog geen mappen. Maak hierboven je eerste map.</p>';
    else topFolders.forEach(f=>{
      const count=rows.filter(d=>d.folder_id===f.id).length;
      const subCount=folders.filter(x=>x.parent_id===f.id).length;
      folderEl.innerHTML+=folderCard(f,count,subCount);
    });

    const unassigned=rows.filter(d=>!d.folder_id);
    const unEl=document.getElementById("unassigned");
    if(!unassigned.length) unEl.innerHTML='<p class="muted empty">Geen drones zonder map.</p>';
    else unassigned.forEach(d=>{
      unEl.innerHTML+=`<div class="item"><div><b>${esc(d.drone_id)}</b><div class="muted">${d.registration_number?`Registratie: ${esc(d.registration_number)} · `:""}${esc(d.type||"")}</div></div>
        <button onclick="openDrone('${esc(d.drone_id)}')">Openen</button></div>`;
    });
  }catch(e){showError(e)}
}
async function dashboard(){
  try{
    const [rows,folders]=await Promise.all([getDrones(),getFolders()]);
    const good=rows.filter(d=>d.is_deployable!==false).length;
    const bad=rows.length-good;
    const types=["ISR","DROP","STRIKE"];
    const directChildren=(fid)=>folders.filter(f=>String(f.parent_id)===String(fid));
    const descendants=(fid)=>{
      const ids=new Set([String(fid)]); let changed=true;
      while(changed){changed=false; folders.forEach(f=>{if(f.parent_id!=null && ids.has(String(f.parent_id)) && !ids.has(String(f.id))){ids.add(String(f.id));changed=true;}})}
      return ids;
    };
    const stats=folders.filter(f=>!f.parent_id).map(f=>{
      const ids=descendants(f.id);
      const ds=rows.filter(d=>d.folder_id!=null && ids.has(String(d.folder_id)));
      return {f,total:ds.length,good:ds.filter(d=>d.is_deployable!==false).length,bad:ds.filter(d=>d.is_deployable===false).length};
    });
    const typeStats=types.map(t=>{
      const ds=rows.filter(d=>String(d.type||"").toUpperCase()===t);
      return {t,total:ds.length,good:ds.filter(d=>d.is_deployable!==false).length,bad:ds.filter(d=>d.is_deployable===false).length};
    });
    app.innerHTML=`<div class="card hero">
      <div class="section-head"><div><div class="crumb">Overzicht</div><h2>Dashboard</h2><p class="muted">Actuele inzetbaarheid van je dronevloot.</p></div>
      <button class="secondary" onclick="location.hash=''">← Terug</button></div>
    </div>
    <div class="grid">
      <div class="card"><div class="muted">Totaal drones</div><div style="font-size:30px;font-weight:800">${rows.length}</div></div>
      <div class="card"><div class="muted">Inzetbaar</div><div style="font-size:30px;font-weight:800;color:var(--accent)">${good}</div></div>
      <div class="card"><div class="muted">Niet inzetbaar</div><div style="font-size:30px;font-weight:800;color:var(--danger)">${bad}</div></div>
    </div>
    <div class="card"><h2>Per type</h2>
      <div class="list">
        ${typeStats.map(s=>`<div class="item">
          <div><b>${s.t}</b><div class="muted">${s.total} totaal · ${s.good} inzetbaar · ${s.bad} niet inzetbaar</div></div>
          <span class="badge">${s.total?s.good+"/"+s.total:"0"}</span>
        </div>`).join("")}
      </div>
    </div>
    <div class="card"><h2>Per hoofdmap</h2><div class="list" id="dashFolders"></div></div>`;
    const el=document.getElementById("dashFolders");
    if(!stats.length){el.innerHTML='<p class="muted">Nog geen mappen.</p>';return;}
    stats.forEach(s=>el.innerHTML+=`<div class="item"><div><b>▣ ${esc(s.f.name)}</b><div class="muted">${s.total} drones · ${s.good} inzetbaar · ${s.bad} niet inzetbaar</div></div><button onclick="openFolder(${s.f.id})">Openen</button></div>`);
  }catch(e){showError(e)}
}

async function newFolder(parentId=null){
  const name=prompt(parentId ? "Naam van de nieuwe submap:" : "Naam van de nieuwe map:");
  if(name===null) return;
  const clean=name.trim();
  if(!clean){alert("Geef de map een naam.");return;}
  try{
    const payload={name:clean,parent_id:parentId?Number(parentId):null};
    const {data,error}=await db.from("folders").insert(payload).select().single();
    if(error) throw error;
    openFolder(data.id);
  }catch(e){showError(e)}
}
function openFolder(id){location.hash="folder="+encodeURIComponent(id);}
function openDrone(id){location.hash="drone="+encodeURIComponent(id);}
async function folderPage(folderId){
  try{
    const [folders,rows]=await Promise.all([getFolders(),getDrones()]);
    const folder=folders.find(f=>String(f.id)===String(folderId));
    if(!folder){
      app.innerHTML='<div class="card"><h2>Map niet gevonden</h2><button onclick="location.hash=\'\'">Terug</button></div>';return;
    }
    const parent=folder.parent_id ? folders.find(f=>String(f.id)===String(folder.parent_id)) : null;
    const subfolders=folders.filter(f=>String(f.parent_id)===String(folder.id));
    const drones=rows.filter(d=>String(d.folder_id)===String(folder.id));

    app.innerHTML=`<div class="card">
      <div class="actions">
        <button class="secondary" onclick="${parent?`openFolder(${parent.id})`:`location.hash=''`}">← ${parent?`Naar ${esc(parent.name)}`:"Alle mappen"}</button>
        <button onclick="newFolder(${folder.id})">+ Submap</button>
        <button onclick="newDrone(${folder.id})">+ Drone toevoegen</button>
        <button class="secondary" onclick="renameFolder(${folder.id},'${esc(folder.name).replace(/'/g,"\\'")}')">Mapnaam wijzigen</button>
      </div>
      <div class="crumb">Map</div>
      <h2>📁 ${esc(folder.name)}</h2>
      <p class="muted">${subfolders.length} ${subfolders.length===1?"submap":"submappen"} · ${drones.length} ${drones.length===1?"drone":"drones"}</p>
    </div>
    <div class="card"><h2>Submappen</h2><div id="subfolders" class="list"></div></div>
    <div class="card"><h2>Drones in deze map</h2><div id="list" class="list"></div></div>`;

    const sf=document.getElementById("subfolders");
    if(!subfolders.length) sf.innerHTML='<p class="muted">Nog geen submappen.</p>';
    else subfolders.forEach(f=>{
      const count=rows.filter(d=>d.folder_id===f.id).length;
      const subCount=folders.filter(x=>x.parent_id===f.id).length;
      sf.innerHTML+=folderCard(f,count,subCount);
    });

    const list=document.getElementById("list");
    if(!drones.length){list.innerHTML='<p class="muted">Nog geen drones in deze map. Je kunt hierboven een drone of submap toevoegen.</p>';return;}
    drones.forEach(d=>list.innerHTML+=`<div class="item"><div><b>${esc(d.drone_id)}</b><div class="muted">${d.registration_number?`Registratie: ${esc(d.registration_number)} · `:""}${esc(d.type||"")}</div></div>
      <button onclick="openDrone('${esc(d.drone_id)}')">Openen</button></div>`);
  }catch(e){showError(e)}
}
async function newDrone(folderId){
  try{
    const rows=await getDrones();
    const nums=rows.map(x=>/^DRONE-(\d+)$/.test(x.drone_id)?+x.drone_id.split("-")[1]:0);
    const id="DRONE-"+(Math.max(0,...nums)+1).toString().padStart(3,"0");
    const {error}=await db.from("drones").insert({drone_id:id,folder_id:folderId});
    if(error) throw error;
    openDrone(id);
  }catch(e){showError(e)}
}
async function renameFolder(id,currentName){
  const name=prompt("Nieuwe mapnaam:",currentName);
  if(name===null) return;
  const clean=name.trim();
  if(!clean){alert("Geef de map een naam.");return;}
  try{
    const {error}=await db.from("folders").update({name:clean}).eq("id",id);
    if(error) throw error;
    if(location.hash.startsWith("#folder=")) folderPage(id); else home();
  }catch(e){showError(e)}
}
async function removeFolder(id,name){
  try{
    const {count,error:countError}=await db.from("drones").select("id",{count:"exact",head:true}).eq("folder_id",id);
    if(countError) throw countError;
    const {count:subCount,error:subError}=await db.from("folders").select("id",{count:"exact",head:true}).eq("parent_id",id);
    if(subError) throw subError;
    if((count||0)>0 || (subCount||0)>0){
      alert(`Map "${name}" bevat nog ${count||0} ${(count||0)===1?"drone":"drones"} en ${subCount||0} ${(subCount||0)===1?"submap":"submappen"}. Verwijder of verplaats die eerst.`);
      return;
    }
    if(!confirm(`Map "${name}" verwijderen?`)) return;
    const {error}=await db.from("folders").delete().eq("id",id);
    if(error) throw error;
    location.hash="";
  }catch(e){showError(e)}
}
async function dronePage(id){
  try{
    const [d,folders]=await Promise.all([getDrone(id),getFolders()]);
    if(!d){app.innerHTML='<div class="card"><h2>Drone niet gevonden</h2><button onclick="location.hash=\'\'">Terug</button></div>';return;}
    const options=folders.map(f=>`<option value="${f.id}" ${String(f.id)===String(d.folder_id)?"selected":""}>${esc(f.name)}</option>`).join("");
    app.innerHTML=`<div class="card">
      <div class="actions"><button class="secondary" onclick="${d.folder_id?`location.hash='folder='+encodeURIComponent('${d.folder_id}')`:`location.hash=''`}">← Terug</button>
      <button onclick="editSave('${esc(id)}')">Opslaan</button><button class="danger" onclick="removeDrone('${esc(id)}')">Verwijderen</button></div>
      <h2>${esc(id)}</h2><p class="muted">${d.registration_number?`Registratienummer: <b>${esc(d.registration_number)}</b>`:"Nog geen registratienummer"}</p>
      <div id="deployStatus" class="status" style="display:flex;justify-content:space-between;align-items:center;gap:10px"></div>
      <div id="status"></div>
      <label>Map</label>
      <select id="folder_id" class="select"><option value="">Geen map</option>${options}</select>
      <div class="grid">
      ${field("Registratienummer","registration_number",d.registration_number||"")}<label for="type">Type</label>
    <select id="type" class="select">
      <option value="">Kies type</option>
      <option value="ISR" ${d.type==="ISR"?"selected":""}>ISR</option>
      <option value="DROP" ${d.type==="DROP"?"selected":""}>DROP</option>
      <option value="STRIKE" ${d.type==="STRIKE"?"selected":""}>STRIKE</option>
    </select>${field("Flight controller","fc",d.fc)}
      ${field("ESC","esc",""+(d.esc||""))}${field("Motoren","motors",d.motors)}
      ${field("RX","rx",d.rx)}${field("VTX","vtx",d.vtx)}
      ${field("GPS","gps",d.gps)}${field("Firmware","firmware",d.firmware)}
      ${field("Accu","battery",d.battery)}</div>
      <label>Notities</label><textarea id="notes" rows="7">${esc(d.notes)}</textarea>
      <label>Onderhoudshistorie</label><textarea id="history" rows="7">${esc(d.history)}</textarea>
    </div>
    <div class="card qrbox"><h2>QR-sticker</h2>
      <p class="muted">Deze QR opent altijd deze dronepagina. Wijzigingen aan de map veranderen de QR niet.</p>
      <img src="${qrImage(qrUrl(id))}" alt="QR-code ${esc(id)}"><p><b>${esc(id)}</b></p>
      <div class="actions" style="justify-content:center"><button onclick="downloadQR('${esc(id)}')">QR opslaan</button><button class="secondary" onclick="printQR('${esc(id)}')">QR printen</button></div>
    </div>`;
    const deploy=document.getElementById("deployStatus");
    const ok=d.is_deployable!==false;
    deploy.style.background=ok?"#eef5f1":"#fff0ef";
    deploy.style.color=ok?"var(--accent)":"var(--danger)";
    deploy.innerHTML=`<b>${ok?"✓ INZETBAAR":"✕ NIET INZETBAAR"}</b><button class="${ok?"danger":"secondary"}" onclick="toggleDeploy('${esc(id)}',${ok})">${ok?"Niet inzetbaar maken":"Inzetbaar maken"}</button>`;
  }catch(e){showError(e)}
}
async function toggleDeploy(id,current){
  const {error}=await db.from("drones").update({is_deployable:!current,updated_at:new Date().toISOString()}).eq("drone_id",id);
  if(error){showError(error);return}
  dronePage(id);
}
async function editSave(id){
  const folderValue=document.getElementById("folder_id").value;
  const row={folder_id:folderValue?Number(folderValue):null,registration_number:document.getElementById("registration_number").value.trim(),type:type.value,fc:fc.value,esc:document.getElementById("esc").value,motors:motors.value,rx:rx.value,vtx:vtx.value,gps:gps.value,firmware:firmware.value,battery:battery.value,notes:notes.value,history:history.value,updated_at:new Date().toISOString()};
  const {error}=await db.from("drones").update(row).eq("drone_id",id);
  if(error){showError(error);return}
  document.getElementById("status").innerHTML='<div class="status">✓ Opgeslagen</div>';
}
async function removeDrone(id){
  if(!confirm("Deze drone verwijderen?")) return;
  const {error}=await db.from("drones").delete().eq("drone_id",id);
  if(error){showError(error);return} location.hash="";
}
function downloadQR(id){
  const a=document.createElement("a");a.href=qrImage(qrUrl(id));a.download=id+"-QR.png";a.target="_blank";document.body.appendChild(a);a.click();a.remove();
}
function printQR(id){
  const w=window.open("","_blank","width=500,height=650");
  w.document.write(`<html><head><title>${id}</title><style>body{text-align:center;font-family:Arial;padding:20px}img{width:45mm;height:45mm}</style></head><body><img src="${qrImage(qrUrl(id))}"><h3>${id}</h3><script>window.onload=()=>window.print()<\\/script></body></html>`);
  w.document.close();
}
async function render(){
  if(location.hash==="#dashboard"){ await dashboard();
  }else if(location.hash.startsWith("#drone=")){
    const id=decodeURIComponent(location.hash.slice(7)); await dronePage(id);
  }else if(location.hash.startsWith("#folder=")){
    const id=decodeURIComponent(location.hash.slice(8)); await folderPage(id);
  }else await home();
}
window.addEventListener("hashchange",render); render();
</script>
</body>
</html>
